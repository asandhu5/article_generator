<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Article Generator{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<nav class="topnav">
  <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark"></span>AI Article Generator</a>
  <div class="nav-links">
    <a href="{{ url_for('index') }}" class="{{ 'active' if active_page == 'setup' else '' }}">New Article</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if active_page == 'history' else '' }}">History</a>
  </div>
</nav>
<main class="container{{ ' container-wide' if active_page == 'article' else '' }}">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  Every article is planned, drafted, and polished automatically before you see the final result.
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
